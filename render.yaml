services:
  - type: web
    name: omnisight-analytics-dashboard
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python data/sample_data.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
