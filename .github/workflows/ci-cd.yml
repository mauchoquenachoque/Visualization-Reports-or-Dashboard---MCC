name: OmniSight CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate_and_test:
    name: Build, Test & Lint Analytics App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Sample Data Pipeline
        run: |
          python data/sample_data.py

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile app.py
          python -m py_compile components/kpi_cards.py
          python -m py_compile components/charts_plotly.py
          python -m py_compile components/charts_seaborn.py
          python -m py_compile components/comparison_engine.py
          python -m py_compile components/report_generator.py

      - name: Streamlit Smoke Test
        run: |
          python -c "import streamlit; import plotly; import seaborn; print('All core visualization libraries loaded successfully!')"

  deploy_trigger:
    name: Trigger Automated Cloud SaaS Deployment
    needs: validate_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment Webhook Notification
        run: |
          echo "OmniSight Dashboard successfully verified for automated deployment on Streamlit Community Cloud and Render SaaS."
